services:

  php:
    build: .
    container_name: todo-app

    ports:
      - "80:80"

    volumes:
      - .:/var/www/html

    depends_on:
      - mysql

  mysql:
    image: mysql:8.0

    container_name: todo-db

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mytododb
      MYSQL_USER: todo_user
      MYSQL_PASSWORD: password

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/todo-db.sql:/docker-entrypoint-initdb.d/todo-db.sql

volumes:
  mysql-data:
