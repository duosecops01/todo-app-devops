name: Deploy Todo App to EKS

on:
  push:
    branches:
      - main


jobs:

  deploy:

    runs-on: ubuntu-latest


    steps:

    - name: Checkout Code
      uses: actions/checkout@v4


    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4

      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}

        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

        aws-region: us-east-1


    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v2


    - name: Build Docker Image
      run: |

        docker build -t duosecops .


    - name: Tag Docker Image
      run: |

        docker tag duosecops:latest \
        103731055876.dkr.ecr.us-east-1.amazonaws.com/duosecops:${{ github.sha }}


    - name: Push Image to ECR
      run: |

        docker push \
        103731055876.dkr.ecr.us-east-1.amazonaws.com/duosecops:${{ github.sha }}


    - name: Configure kubectl for EKS
      run: |

        aws eks update-kubeconfig \
        --name duosecops-cluster \
        --region us-east-1


    - name: Deploy to Kubernetes
      run: |

        kubectl set image deployment/todo-app \
        todo-app=103731055876.dkr.ecr.us-east-1.amazonaws.com/duosecops:${{ github.sha }} \
        -n todo-app


    - name: Verify Deployment
      run: |

        kubectl rollout status deployment/todo-app -n todo-app
