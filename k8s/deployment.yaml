apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
  namespace: todo-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: todo-app

  template:
    metadata:
      labels:
        app: todo-app

    spec:
      containers:
      - name: todo-app
        image: IMAGE_PLACEHOLDER      
        ports:
        - containerPort: 80

        env:
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: todo-db-secret
              key: DB_HOST

        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: todo-db-secret
              key: DB_USER

        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: todo-db-secret
              key: DB_PASS

        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: todo-db-secret
              key: DB_NAME
